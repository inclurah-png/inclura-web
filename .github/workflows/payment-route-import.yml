name: Payment route import smoke test

on:
  pull_request:
    paths:
      - "backend/**"
      - "src/config/pricing/**"
      - ".github/workflows/payment-route-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-route-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund

      - name: Import payment route and trusted pricing modules
        run: |
          node --input-type=module -e "await import('./backend/src/routes/paymentRoutes.js'); await import('./backend/src/routes/passkeyRoutes.js'); console.log('Payment and passkey routes import successfully.');"
