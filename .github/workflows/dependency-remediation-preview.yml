name: Dependency remediation preview

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/dependency-remediation-preview.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - security/dependency-remediation

permissions:
  contents: read

concurrency:
  group: dependency-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  remediation-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Test React Router v7 candidate without changing the branch manifest
        run: |
          npm install --package-lock-only --save-exact react-router-dom@7.18.7
      - name: Test Firebase 13.4.0 candidate without changing the branch manifest
        run: |
          npm install --package-lock-only --save-exact firebase@13.4.0
      - name: Test safe Axios override for the Flutterwave SDK
        run: |
          npm pkg set 'overrides.axios=1.21.1'
          npm install --package-lock-only
          npm ci
      - name: Test Firebase Firestore gRPC security fix candidate
        run: |
          npm pkg set 'overrides.@grpc/grpc-js=1.14.7'
          npm install --package-lock-only
          npm ci
      - name: Build application
        run: npm run build
      - name: Produce dependency audit report
        run: |
          npm audit --json > npm-audit-after.json || true
          node -e "const a=require('./npm-audit-after.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2))"
      - name: Package remediation evidence
        run: |
          zip dependency-remediation-preview.zip package.json package-lock.json npm-audit-after.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-preview
          path: dependency-remediation-preview.zip
          retention-days: 2
