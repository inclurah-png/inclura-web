name: Deploy Inclura to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Check Firebase service account secret safely
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INCLURA_PROD_90734 }}
        run: |
          node <<'NODE'
          try {
            const value = process.env.FIREBASE_SERVICE_ACCOUNT_JSON || "";
            const account = JSON.parse(value);
            console.log("Secret contains valid JSON:", true);
            console.log("Top-level client_email exists:", typeof account.client_email === "string" && account.client_email.includes("@"));
            console.log("Top-level JSON field names:", Object.keys(account).join(", "));
            const findPaths = (obj, target, prefix = "") => {
              if (!obj || typeof obj !== "object") return [];
              return Object.entries(obj).flatMap(([key, value]) => {
                const path = prefix ? prefix + "." + key : key;
                return [...(key === target ? [path] : []), ...findPaths(value, target, path)];
              });
            };
            console.log("client_email field locations:", findPaths(account, "client_email").join(", ") || "not found");
            console.log("project_id field locations:", findPaths(account, "project_id").join(", ") || "not found");
          } catch (error) {
            console.log("Secret contains valid JSON:", false);
            console.log("JSON parsing failed; secret content was not displayed.");
            process.exit(1);
          }
          NODE

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INCLURA_PROD_90734 }}
          projectId: inclura-prod-90734
          channelId: live
