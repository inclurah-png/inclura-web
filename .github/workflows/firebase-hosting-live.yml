name: Deploy Inclura to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        env:
          VITE_RECAPTCHA_V3_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_V3_SITE_KEY }}
        run: npm run build

      - name: Prepare Firebase service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INCLURA_PROD_90734 }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          let account = process.env.FIREBASE_SERVICE_ACCOUNT_JSON || "";
          try {
            account = JSON.parse(account);
            if (typeof account === "string") account = JSON.parse(account);
            if (!account || typeof account !== "object" || Array.isArray(account)) {
              throw new Error("Credential data is not a JSON object");
            }
            if (typeof account.client_email !== "string" || !account.client_email.includes("@")) {
              throw new Error("Service account client_email is missing");
            }
            if (account.project_id !== "inclura-prod-90734") {
              throw new Error("Service account project_id does not match");
            }
            const json = JSON.stringify(account);
            fs.writeFileSync("/tmp/firebase-service-account.json", json, { mode: 0o600 });
            console.log("Firebase credentials validated for service account:", account.client_email);
          } catch (error) {
            console.error("Firebase credential format check failed:", error.message);
            process.exit(1);
          }
          NODE

      - name: Deploy Firestore security rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
        run: |
          npx --yes firebase-tools@latest deploy --only firestore:rules --project inclura-prod-90734

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
        run: |
          npx --yes firebase-tools@latest deploy --only hosting --project inclura-prod-90734
