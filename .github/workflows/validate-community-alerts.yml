name: Validate Inclura community alerts

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_SOS_NOTIFICATION_BACKEND_URL: https://inclura-ifse-backend.onrender.com
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build
      - name: Audit installed dependencies
        run: npm audit --audit-level=moderate

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check changed backend JavaScript syntax
        run: |
          node --check backend/src/config/notificationConfig.js
          node --check backend/src/services/notificationProviders.js
          node --check backend/src/middleware/firebaseAuth.js
          node --check backend/src/controllers/emergencyController.js
          node --check backend/src/routes/sosNotificationRoutes.js
          node --check backend/src/routes/emergencyRoutes.js
          node --check backend/src/services/pushNotificationService.js
          node --check backend/src/services/sosNotificationService.js
          node --check backend/src/services/textbeeWebhookSecurity.js
          node --check backend/src/controllers/textbeeWebhookController.js
          node --check backend/src/routes/textbeeWebhookRoutes.js
          node --check backend/server.js
          node --check backend/app.js
      - name: Test notification provider and webhook security
        working-directory: backend
        run: node --test test/notificationConfig.test.js test/notificationProviders.test.js test/textbeeWebhookSecurity.test.js

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Validate Firestore rules with emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-inclura-rules "echo Firestore rules loaded successfully"
