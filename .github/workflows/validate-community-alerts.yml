name: Validate Inclura community alerts

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_SOS_NOTIFICATION_BACKEND_URL: https://inclura-ifse-backend.onrender.com
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build
      - name: Compatibility build with validated dependency security candidates
        run: |
          npm install --package-lock-only --save-exact vite@6.4.6 @vitejs/plugin-react@4.4.1
          npm install --package-lock-only --save-exact react-router-dom@7.18.7
          npm install --package-lock-only --save-exact firebase@13.4.0
          npm pkg set 'overrides.axios=1.21.1' 'overrides.@grpc/grpc-js=1.14.7'
          npm audit fix
          npm ci
          npm audit
          npm run build
      - name: Preserve validated dependency manifests
        uses: actions/upload-artifact@v4
        with:
          name: inclura-validated-dependency-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit audited dependency updates to the pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): apply validated zero-vulnerability updates"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check changed backend JavaScript syntax
        run: |
          node --check backend/src/config/notificationConfig.js
          node --check backend/src/services/notificationProviders.js
          node --check backend/src/middleware/firebaseAuth.js
          node --check backend/src/routes/sosNotificationRoutes.js
          node --check backend/src/routes/emergencyRoutes.js
          node --check backend/src/services/pushNotificationService.js
          node --check backend/src/services/sosNotificationService.js
          node --check backend/src/services/textbeeWebhookSecurity.js
          node --check backend/src/controllers/textbeeWebhookController.js
          node --check backend/src/routes/textbeeWebhookRoutes.js
          node --check backend/server.js
          node --check backend/app.js
      - name: Test notification provider and webhook security
        working-directory: backend
        run: node --test test/notificationConfig.test.js test/notificationProviders.test.js test/textbeeWebhookSecurity.test.js

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Validate Firestore rules with emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-inclura-rules "echo Firestore rules loaded successfully"
