<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <title>Inclura</title>
    <style>
      body { margin: 0; background: #020617; color: white; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      #startup-status { min-height: 100vh; display: grid; place-content: center; padding: 24px; text-align: center; }
      #startup-status h1 { color: #38bdf8; font-size: 26px; margin: 0 0 12px; }
      #startup-status p { max-width: 460px; line-height: 1.6; margin: 0 auto; }
      #startup-status small { display: block; margin-top: 12px; color: #94a3b8; overflow-wrap: anywhere; }
    </style>
    <script>
      (function () {
        function showStartupError(title, message) {
          var root = document.getElementById("root");
          if (!root || root.dataset.reactMounted) return;
          var safeMessage = String(message || "No additional details were provided").slice(0, 240);
          root.innerHTML = "";
          var main = document.createElement("main");
          main.id = "startup-status";
          main.setAttribute("role", "alert");
          var section = document.createElement("section");
          var heading = document.createElement("h1");
          heading.textContent = title;
          var paragraph = document.createElement("p");
          paragraph.textContent = "Inclura opened, but its application could not start. Please send this diagnostic message to Inclura support.";
          var detail = document.createElement("small");
          detail.textContent = "Diagnostic: " + safeMessage;
          section.append(heading, paragraph, detail);
          main.append(section);
          root.append(main);
        }

        window.__incluraStartupTimer = window.setTimeout(function () {
          showStartupError("Inclura is having trouble starting", "Startup timed out before React mounted. Check the application bundle and browser compatibility.");
        }, 15000);

        window.addEventListener("error", function (event) {
          if (event && event.target && event.target !== window && event.target.tagName === "SCRIPT") {
            showStartupError("Inclura could not load its application files", "A JavaScript file failed to download. Check the network request for the application bundle.");
            return;
          }
          if (event && event.message) {
            showStartupError("Inclura encountered a startup error", event.message);
          }
        }, true);

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          var message = reason && reason.message ? reason.message : reason;
          showStartupError("Inclura encountered a startup error", message || "An application startup task was rejected.");
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main id="startup-status" aria-live="polite">
        <section><h1>Inclura</h1><p>Loading your inclusive community platform…</p></section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
